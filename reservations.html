 <main>
    <h2> Reservations </h2>
 
            <div class="formRow">            
               <label for="name">Name*</label>
               <input name="custName" id="name" type="text" placeholder="name" required>
            </div>

            <div class="formRow"> 
               <label for="phone">Phone number</label>
               <input name="custPhone" id="phone" type="tel" placeholder="(nnn) nnn-nnnn"
                      pattern="^\d{10}$|^(\(\d{3}\)\s*)?\d{3}[\s-]?\d{4}$" >
            </div>

            <div class="formRow"> 
               <label for="mail">E-mail*</label>
               <input name="custEmail" id="mail" type="email" required >
            </div>
            
 
            
            <div class="formRow">
               <label for="#guests">Number of guests*</label>
               <input name="#guests" id="#guests" type="number" 
                      value="1" step="1" min="0" max="20" required>
            </div>        
         
         <fieldset id="expInfo">
            <legend>Reservation Details</legend>
            
            <div class="formRow">
               <label for="visit">Check In Date*</label>
               <input name="visitDate" id="visit" type="date" >
            </div>

            <div class="formRow">
               <label for="leave">Check Out Date*</label>
               <input name="leaveDate" id="leave" type="date" >
            </div>
            
            <div class="formRow">
               <label for="order">Select Room*</label>
               <select name="orderType" id="order">
                  <option value="basicroom">Basic Room</option>
                  <option value="budgetroom">Budget Room</option>
                  <option value="sauropodsuite">Sauropod Suite</option>
               </select>
            </div> 
            
            <div class="formRow">
               <label>Do you like the Dinosaurs?</label>
               <fieldset class="optGroup">
                  <label for="hYes">Yes</label>
                  <input name="likedinos" id="dYes" value="yes" type="radio" required>
                  <label for="dNo">No</label>
                  <input name="likedinos" id="dNo" value="no" type="radio" >
               </fieldset>
            </div>         
            
            <label for="commBox">Special Requests</label>
            <textarea name="custExp" id="commBox"></textarea>            
            
         </fieldset>

            <div class="formRow">
               <label>Breakfast - $30/person/day</label>
               <fieldset class="optGroup">
                  <label for="bYes">Yes</label>
                  <input name="breakfast" id="bYes" value="yes" type="radio" >
                  <label for="bNo">No</label>
                  <input name="breakfast" id="bNo" value="no" type="radio" >
               </fieldset>
            </div>    

            <div class="formRow">
               <label>Dinosaur Plushies - $40</label>
               <fieldset class="optGroup">
                  <label for="pYes">Yes</label>
                  <input name="plushies" id="pYes" value="yes" type="radio" >
                  <label for="pNo">No</label>
                  <input name="plushies" id="pNo" value="no" type="radio" >
               </fieldset>
            </div>    

            <div class="formRow">
               <label>Parking - $20/night</label>
               <fieldset class="optGroup">
                  <label for="hYes">Yes</label>
                  <input name="foodHot" id="hYes" value="yes" type="radio" >
                  <label for="hNo">No</label>
                  <input name="foodHot" id="hNo" value="no" type="radio" >
               </fieldset>
            </div>    


         <div id="buttons">
            <input type="submit" value="Submit My Survey" >
            <input type="reset" value="Cancel" >
         </div>         



  </main>
